name: hydropandas

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Test suite with py311-ubuntu
            python: "3.11"
            toxenv: py311
          - name: Formatting and linting with ruff
            python: "3.11"
            toxenv: ruff

    name: ${{ matrix.name }}
    env:
      # Color Output
      # Rich (pip)
      FORCE_COLOR: 1
      # Tox
      PY_COLORS: 1
      # Pytest
      PYTEST_ADDOPTS: "--color=yes"
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          check-latest: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox

      - name: Setup tox environment
        run: tox -e ${{ matrix.toxenv }} --notest

      - name: Test
        run: tox -e ${{ matrix.toxenv }} --skip-pkg-install

      - name: Extract coverage percentage
        id: extract_cov
        run: |
          # Reads the total percentage from the JSON report generated by pytest-cov
          COVERAGE=$(python -c "import json; print(json.load(open('coverage.json'))['totals']['percent_covered_display'])")
          echo "COVERAGE=$COVERAGE" >> $GITHUB_ENV
          
          # Determine badge color based on percentage
          if [ $(echo "$COVERAGE < 60" | bc -l) -eq 1 ]; then
            echo "COLOR=red" >> $GITHUB_ENV
          elif [ $(echo "$COVERAGE < 80" | bc -l) -eq 1 ]; then
            echo "COLOR=orange" >> $GITHUB_ENV
          else
            echo "COLOR=green" >> $GITHUB_ENV
          fi

      - name: Update Coverage Badge Gist
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: 3b2ba1c2b37e745109b2c7f2fdde60de
          filename: hydropandas-coverage.json
          label: Coverage
          message: ${{ env.COVERAGE }}%
          color: ${{ env.COLOR }}