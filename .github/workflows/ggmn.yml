name: ggmn

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - dev
  schedule:
    - cron: '0 0 * * 1'

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test ggmn api
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          check-latest: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytest

      - name: Run test
        run: |
          pytest tests/api/test_109_ggmn_api.py