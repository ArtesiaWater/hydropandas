name: lizard Rotterdam

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - dev
  schedule:
    - cron: '0 0 * * 1'

jobs:
  test:
    if: ${{ github.event.pull_request.head.repo.full_name == 'ArtesiaWater/hydropandas' }}
    runs-on: ubuntu-latest
    name: Test lizard rotterdam api
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          check-latest: true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run test
        env:
          LIZARD_ROTTERDAM_API_KEY: ${{ secrets.LIZARD_ROTTERDAM_API_KEY }}
        run: |
          pytest tests/api/test_106_lizard_api_rotterdam.py